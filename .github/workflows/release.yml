name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare linux/amd64 artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="snapshot"; fi
          cp dist/aurora "dist/aurora_${version}_linux_amd64"
          (cd dist && sha256sum "aurora_${version}_linux_amd64") > "dist/aurora_${version}_linux_amd64.sha256"

      - name: Upload linux/amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-linux-amd64
          path: |
            dist/aurora_*_linux_amd64
            dist/aurora_*_linux_amd64.sha256
          if-no-files-found: error
