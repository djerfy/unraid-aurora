version: 2

project_name: aurora

before:
  hooks:
    - npm --prefix frontend ci
    - npm --prefix frontend run build
    - rm -rf backend/internal/webui/dist
    - cp -R frontend/dist backend/internal/webui/dist

builds:
  - id: aurora
    dir: backend
    main: ./cmd/aurorad
    binary: aurora
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: aurora
    formats:
      - binary
    name_template: aurora_{{ .Version }}_linux_amd64

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^chore: release"
      - "^test:"
      - "^Merge "
      - "^Merge pull request"
  groups:
    - title: "🚀 Features"
      regexp: '^feat(\([[:word:]]+\))?!?:'
      order: 0
    - title: "🐛 Bug fixes"
      regexp: '^fix(\([[:word:]]+\))?!?:'
      order: 1
    - title: "📚 Documentation"
      regexp: '^docs(\([[:word:]]+\))?!?:'
      order: 2
    - title: "🎨 Style"
      regexp: '^style(\([[:word:]]+\))?!?:'
      order: 3
    - title: "♻️ Refactoring"
      regexp: '^refactor(\([[:word:]]+\))?!?:'
      order: 4
    - title: "⚡ Performance"
      regexp: '^perf(\([[:word:]]+\))?!?:'
      order: 5
    - title: "🔧 Maintenance"
      regexp: '^(chore|build|ci)(\([[:word:]]+\))?!?:'
      order: 6
    - title: "Other changes"
      order: 999

release:
  name_template: "Aurora v{{ .Version }}"
  prerelease: auto
  draft: false
